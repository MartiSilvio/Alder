name: .NET

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --framework net8.0 --verbosity normal

      - name: Test .NET Framework 4.7.2
        if: matrix.os == 'windows-latest'
        run: dotnet test tests/Alder.Test/Alder.Test.csproj --no-build --configuration Release --framework net472 --verbosity normal

      - name: Pack
        run: dotnet pack src/Alder/Alder.csproj --configuration Release --output artifacts/packages

      - name: Verify NuGet package
        run: dotnet run --project tests/Alder.PackageVerification/Alder.PackageVerification.csproj -- artifacts/packages
